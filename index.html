<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>抓住游荡的小猫</title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      position: fixed;
      top: 0;
      left: 0;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    .video-src {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    #fairy-tale-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #FCE6F5;
      z-index: 1;
      transition: filter 0.5s ease, opacity 0.5s ease;
    }

    #fairy-tale-bg::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: radial-gradient(circle, rgba(255,255,255,0.6) 2px, transparent 2px);
      background-size: 30px 30px;
      opacity: 0.5;
    }

    .cloud {
      position: absolute;
      background: #fff;
      border-radius: 100px;
      opacity: 0.8;
      animation: cloudFloat linear infinite;
    }
    .cloud::before, .cloud::after {
      content: "";
      position: absolute;
      background: #fff;
      border-radius: 100px;
    }
    .cloud1 {
      width: 100px; height: 40px;
      top: 10%; left: -120px;
      animation-duration: 25s;
    }
    .cloud1::before { width: 50px; height: 50px; top: -25px; left: 10px; }
    .cloud1::after { width: 60px; height: 40px; top: -15px; right: 10px; }
    .cloud2 {
      width: 80px; height: 35px;
      top: 25%; left: -100px;
      animation-duration: 30s;
      animation-delay: 5s;
    }
    .cloud2::before { width: 40px; height: 40px; top: -20px; left: 15px; }
    .cloud2::after { width: 50px; height: 35px; top: -12px; right: 8px; }
    .cloud3 {
      width: 120px; height: 45px;
      top: 60%; left: -150px;
      animation-duration: 35s;
      animation-delay: 10s;
    }
    .cloud3::before { width: 55px; height: 55px; top: -28px; left: 20px; }
    .cloud3::after { width: 65px; height: 45px; top: -18px; right: 15px; }

    @keyframes cloudFloat {
      0% { transform: translateX(0); }
      100% { transform: translateX(calc(100vw + 200px)); }
    }

    .star {
      position: absolute;
      color: #FFD700;
      font-size: 20px;
      animation: starTwinkle 2s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes starTwinkle {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    #game-title {
      position: fixed;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 24px;
      font-weight: bold;
      color: #FF6B9D;
      text-shadow: 2px 2px 0px #fff, 4px 4px 0px rgba(255,107,157,0.3);
      z-index: 10;
      pointer-events: none;
      user-select: none;
      white-space: nowrap;
      transition: opacity 0.3s ease;
    }

    #cat-container {
      position: fixed;
      width: 120px;
      height: 120px;
      z-index: 20;
      cursor: pointer;
      will-change: transform;
      animation: breathe 2s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { transform: translate3d(var(--x, 0px), var(--y, 0px), 0) translateY(0px); }
      50% { transform: translate3d(var(--x, 0px), var(--y, 0px), 0) translateY(-8px); }
    }

    #cat-canvas {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 50%;
    }

    .cat-bounce {
      animation: catBounce 0.8s ease !important;
    }
    @keyframes catBounce {
      0% { transform: translate3d(var(--x, 0px), var(--y, 0px), 0) scale(1); }
      30% { transform: translate3d(var(--x, 0px), var(--y, 0px), 0) scale(1.3); }
      50% { transform: translate3d(var(--x, 0px), var(--y, 0px), 0) scale(1.15); }
      70% { transform: translate3d(var(--x, 0px), var(--y, 0px), 0) scale(1.25); }
      100% { transform: translate3d(var(--x, 0px), var(--y, 0px), 0) scale(1); }
    }

    .trail-star {
      position: fixed;
      width: 12px;
      height: 12px;
      pointer-events: none;
      z-index: 15;
      animation: trailFade 1s ease-out forwards;
    }
    .trail-star::before {
      content: "⭐";
      font-size: 12px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    @keyframes trailFade {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(2) translateY(-20px); }
    }

    .bubble {
      position: fixed;
      padding: 12px 18px;
      border-radius: 20px;
      font-size: 15px;
      font-weight: bold;
      z-index: 30;
      pointer-events: none;
      white-space: nowrap;
      opacity: 0;
      transform: translate(-50%, -100%) scale(0.5);
      transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .bubble.show {
      opacity: 1;
      transform: translate(-50%, -120%) scale(1);
    }
    .bubble::after {
      content: "";
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 10px 10px 0;
      border-style: solid;
      border-color: inherit;
      border-right-color: transparent;
      border-bottom-color: transparent;
      border-left-color: transparent;
    }

    .bubble-yellow {
      background: #FFF9C4;
      color: #F57F17;
      border: 2px solid #FFF176;
    }
    .bubble-yellow::after { border-top-color: #FFF9C4; }

    .bubble-green {
      background: #B2DFDB;
      color: #00695C;
      border: 2px solid #80CBC4;
    }
    .bubble-green::after { border-top-color: #B2DFDB; }

    .bubble-gray {
      background: #BDBDBD;
      color: #424242;
      border: 2px solid #9E9E9E;
      animation: textShake 0.3s ease-in-out;
    }
    .bubble-gray::after { border-top-color: #BDBDBD; }

    @keyframes textShake {
      0%, 100% { transform: translate(-50%, -120%) scale(1) translateX(0); }
      25% { transform: translate(-50%, -120%) scale(1) translateX(-3px); }
      75% { transform: translate(-50%, -120%) scale(1) translateX(3px); }
    }

    #horror-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0);
      z-index: 40;
      pointer-events: none;
      transition: background 0.3s ease;
    }
    #horror-overlay.active {
      background: rgba(0, 0, 0, 0.7);
      pointer-events: auto;
    }

    .glitch {
      animation: glitch 0.2s infinite !important;
      filter: hue-rotate(90deg) saturate(3);
    }
    @keyframes glitch {
      0% { transform: translate3d(var(--x, 0px), var(--y, 0px), 0) translate(0); clip-path: inset(10% 0 60% 0); }
      20% { transform: translate3d(var(--x, 0px), var(--y, 0px), 0) translate(-3px, 2px); clip-path: inset(40% 0 20% 0); }
      40% { transform: translate3d(var(--x, 0px), var(--y, 0px), 0) translate(3px, -2px); clip-path: inset(0% 0 80% 0); }
      60% { transform: translate3d(var(--x, 0px), var(--y, 0px), 0) translate(-2px, 3px); clip-path: inset(70% 0 5% 0); }
      80% { transform: translate3d(var(--x, 0px), var(--y, 0px), 0) translate(2px, -3px); clip-path: inset(30% 0 40% 0); }
      100% { transform: translate3d(var(--x, 0px), var(--y, 0px), 0) translate(0); clip-path: inset(10% 0 60% 0); }
    }

    #scare-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 50;
      display: none;
    }

    .screen-shake {
      animation: screenShake 0.1s infinite;
    }
    @keyframes screenShake {
      0% { transform: translate(0, 0); }
      10% { transform: translate(-8px, 6px); }
      20% { transform: translate(6px, -8px); }
      30% { transform: translate(-6px, -6px); }
      40% { transform: translate(8px, 8px); }
      50% { transform: translate(-4px, 4px); }
      60% { transform: translate(4px, -4px); }
      70% { transform: translate(-8px, -4px); }
      80% { transform: translate(6px, 6px); }
      90% { transform: translate(-6px, 8px); }
      100% { transform: translate(0, 0); }
    }

    #blood-flash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      box-shadow: inset 0 0 0 0 rgba(255, 0, 0, 0);
      z-index: 55;
      pointer-events: none;
      display: none;
    }
    .blood-flash-active {
      display: block !important;
      animation: bloodFlash 0.15s infinite;
    }
    @keyframes bloodFlash {
      0%, 100% { box-shadow: inset 0 0 80px 20px rgba(255, 0, 0, 0.3); }
      50% { box-shadow: inset 0 0 120px 40px rgba(255, 0, 0, 0.6); }
    }

    #black-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 48;
      display: none;
      opacity: 0;
      transition: opacity 0.05s ease;
    }

    #reset-btn {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      padding: 18px 40px;
      font-size: 20px;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      border: 2px solid #8B0000;
      border-radius: 8px;
      cursor: pointer;
      z-index: 60;
      opacity: 0;
      transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      text-shadow: 0 0 10px rgba(139, 0, 0, 0.8);
      box-shadow: 0 0 30px rgba(139, 0, 0, 0.4), inset 0 0 20px rgba(139, 0, 0, 0.1);
      letter-spacing: 2px;
    }
    #reset-btn.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
    #reset-btn:active {
      transform: translate(-50%, -50%) scale(0.95);
    }

    .hide-cursor {
      cursor: none !important;
    }
    .hide-cursor * {
      cursor: none !important;
    }

    .bg-fade {
      filter: grayscale(0.7) brightness(0.6) !important;
    }
  </style>
<base target="_blank">
</head>
<body>

  <video id="cat-video-src" class="video-src" src="cat.mp4" muted loop playsinline webkit-playsinline x5-playsinline x5-video-player-type="h5" x5-video-player-fullscreen="false" preload="auto"></video>
  <video id="scare-video-src" class="video-src" src="scare.mp4" playsinline webkit-playsinline x5-playsinline x5-video-player-type="h5" x5-video-player-fullscreen="false" preload="auto"></video>

  <div id="fairy-tale-bg">
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>
    <div class="star" style="top:15%;left:20%;animation-delay:0s;">✨</div>
    <div class="star" style="top:30%;left:70%;animation-delay:0.5s;">⭐</div>
    <div class="star" style="top:50%;left:15%;animation-delay:1s;">✨</div>
    <div class="star" style="top:65%;left:80%;animation-delay:1.5s;">⭐</div>
    <div class="star" style="top:80%;left:40%;animation-delay:0.3s;">✨</div>
    <div class="star" style="top:20%;left:85%;animation-delay:0.8s;">⭐</div>
  </div>

  <div id="game-title">🐱 抓住游荡的小猫 🌟</div>

  <div id="cat-container">
    <canvas id="cat-canvas" width="240" height="240"></canvas>
  </div>

  <div id="horror-overlay"></div>
  <div id="black-screen"></div>
  <div id="blood-flash"></div>

  <canvas id="scare-canvas"></canvas>

  <button id="reset-btn">🩸 重新挑战</button>

  <script>
    const STATE = {
      clickCount: 0,
      isHorror: false,
      isPaused: false,
      catSize: 120,
      speed: 1.5,
      posX: 50,
      posY: 50,
      dirX: 1,
      dirY: 1,
      trailTimer: 0,
      animId: null,
      scareTimer: null,
    };

    const catContainer = document.getElementById('cat-container');
    const catCanvas = document.getElementById('cat-canvas');
    const catCtx = catCanvas.getContext('2d');
    const catVideoSrc = document.getElementById('cat-video-src');

    const scareCanvas = document.getElementById('scare-canvas');
    const scareCtx = scareCanvas.getContext('2d');
    const scareVideoSrc = document.getElementById('scare-video-src');

    const fairyBg = document.getElementById('fairy-tale-bg');
    const horrorOverlay = document.getElementById('horror-overlay');
    const blackScreen = document.getElementById('black-screen');
    const bloodFlash = document.getElementById('blood-flash');
    const resetBtn = document.getElementById('reset-btn');
    const gameTitle = document.getElementById('game-title');
    const body = document.body;

    const dpr = window.devicePixelRatio || 1;
    catCanvas.width = 120 * dpr;
    catCanvas.height = 120 * dpr;
    catCtx.scale(dpr, dpr);

    function resizeScareCanvas() {
      scareCanvas.width = window.innerWidth * dpr;
      scareCanvas.height = window.innerHeight * dpr;
      scareCanvas.style.width = window.innerWidth + 'px';
      scareCanvas.style.height = window.innerHeight + 'px';
      scareCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function drawCatFrame() {
      if (catVideoSrc.readyState >= 2) {
        catCtx.clearRect(0, 0, 120, 120);
        catCtx.save();
        catCtx.beginPath();
        catCtx.arc(60, 60, 58, 0, Math.PI * 2);
        catCtx.clip();
        catCtx.drawImage(catVideoSrc, 0, 0, 120, 120);
        catCtx.restore();
        catCtx.shadowColor = 'rgba(0, 255, 65, 0.4)';
        catCtx.shadowBlur = 15;
        catCtx.strokeStyle = '#00FF41';
        catCtx.lineWidth = 3;
        catCtx.beginPath();
        catCtx.arc(60, 60, 58, 0, Math.PI * 2);
        catCtx.stroke();
        catCtx.shadowBlur = 0;
      }
    }

    function drawScareFrame() {
      if (scareVideoSrc.readyState >= 2 && !scareVideoSrc.paused) {
        const vw = scareVideoSrc.videoWidth || 1;
        const vh = scareVideoSrc.videoHeight || 1;
        const vr = vw / vh;
        const cw = window.innerWidth;
        const ch = window.innerHeight;
        const cr = cw / ch;
        let dw, dh, dx, dy;
        if (vr > cr) {
          dh = ch;
          dw = dh * vr;
          dx = (cw - dw) / 2;
          dy = 0;
        } else {
          dw = cw;
          dh = dw / vr;
          dx = 0;
          dy = (ch - dh) / 2;
        }
        scareCtx.drawImage(scareVideoSrc, dx, dy, dw, dh);
      }
    }

    function renderLoop() {
      if (STATE.isHorror) {
        drawScareFrame();
      } else {
        drawCatFrame();
      }
      STATE.animId = requestAnimationFrame(renderLoop);
    }

    function addTouchClick(el, handler) {
      let triggered = false;
      const onTouch = (e) => {
        e.preventDefault();
        if (!triggered) {
          triggered = true;
          handler(e);
          setTimeout(() => { triggered = false; }, 300);
        }
      };
      const onClick = (e) => {
        if (!triggered) {
          triggered = true;
          handler(e);
          setTimeout(() => { triggered = false; }, 300);
        }
      };
      el.addEventListener('touchstart', onTouch, { passive: false });
      el.addEventListener('click', onClick);
    }

    function initCatPosition() {
      const maxX = window.innerWidth - STATE.catSize;
      const maxY = window.innerHeight - STATE.catSize;
      STATE.posX = Math.random() * maxX;
      STATE.posY = Math.random() * maxY;
      STATE.dirX = Math.random() > 0.5 ? 1 : -1;
      STATE.dirY = Math.random() > 0.5 ? 1 : -1;
      updateCatTransform();
    }

    function updateCatTransform() {
      catContainer.style.setProperty('--x', STATE.posX + 'px');
      catContainer.style.setProperty('--y', STATE.posY + 'px');
    }

    function moveCat() {
      if (STATE.isPaused || STATE.isHorror) {
        setTimeout(moveCat, 16);
        return;
      }
      const maxX = window.innerWidth - STATE.catSize;
      const maxY = window.innerHeight - STATE.catSize;
      STATE.posX += STATE.speed * STATE.dirX;
      STATE.posY += STATE.speed * STATE.dirY;
      if (STATE.posX <= 0) {
        STATE.posX = 0;
        STATE.dirX = 1;
      } else if (STATE.posX >= maxX) {
        STATE.posX = maxX;
        STATE.dirX = -1;
      }
      if (STATE.posY <= 0) {
        STATE.posY = 0;
        STATE.dirY = 1;
      } else if (STATE.posY >= maxY) {
        STATE.posY = maxY;
        STATE.dirY = -1;
      }
      updateCatTransform();
      STATE.trailTimer++;
      if (STATE.trailTimer % 5 === 0) {
        createTrailStar();
      }
      setTimeout(moveCat, 16);
    }

    function createTrailStar() {
      const star = document.createElement('div');
      star.className = 'trail-star';
      const offsetX = STATE.dirX * (-20) + (Math.random() - 0.5) * 20;
      const offsetY = STATE.dirY * (-20) + (Math.random() - 0.5) * 20;
      star.style.left = (STATE.posX + STATE.catSize / 2 + offsetX) + 'px';
      star.style.top = (STATE.posY + STATE.catSize / 2 + offsetY) + 'px';
      document.body.appendChild(star);
      setTimeout(() => {
        if (star.parentNode) star.parentNode.removeChild(star);
      }, 1000);
    }

    function showBubble(text, type) {
      const oldBubble = document.querySelector('.bubble');
      if (oldBubble) oldBubble.remove();
      const bubble = document.createElement('div');
      bubble.className = `bubble bubble-${type}`;
      bubble.textContent = text;
      document.body.appendChild(bubble);
      const centerX = STATE.posX + STATE.catSize / 2;
      const topY = STATE.posY;
      bubble.style.left = centerX + 'px';
      bubble.style.top = topY + 'px';
      requestAnimationFrame(() => {
        bubble.classList.add('show');
      });
      return bubble;
    }

    function hideBubble() {
      const bubble = document.querySelector('.bubble');
      if (bubble) {
        bubble.classList.remove('show');
        setTimeout(() => {
          if (bubble.parentNode) bubble.parentNode.removeChild(bubble);
        }, 300);
      }
    }

    function handleCatClick(e) {
      if (STATE.isHorror || STATE.isPaused) return;
      STATE.clickCount++;
      STATE.isPaused = true;
      catContainer.classList.add('cat-bounce');
      setTimeout(() => {
        catContainer.classList.remove('cat-bounce');
      }, 800);
      if (STATE.clickCount === 1) {
        showBubble('真乖~ 摸摸头 🐾', 'yellow');
        setTimeout(() => {
          hideBubble();
          STATE.isPaused = false;
        }, 2000);
      } else if (STATE.clickCount === 2) {
        showBubble('别跑嘛，再玩会儿~ 😻', 'green');
        setTimeout(() => {
          hideBubble();
          STATE.isPaused = false;
        }, 2000);
      } else if (STATE.clickCount === 3) {
        showBubble('诶？怎么...', 'gray');
        setTimeout(() => {
          fairyBg.classList.add('bg-fade');
          gameTitle.style.opacity = '0.3';
        }, 500);
        setTimeout(() => {
          hideBubble();
          setTimeout(triggerJumpScare, 1500);
        }, 2000);
      }
    }

    function onScareEnd() {
      if (STATE.scareTimer) {
        clearTimeout(STATE.scareTimer);
        STATE.scareTimer = null;
      }
      body.classList.remove('screen-shake');
      bloodFlash.classList.remove('blood-flash-active');
      resetBtn.classList.add('show');
      body.classList.remove('hide-cursor');
    }

    function triggerJumpScare() {
      STATE.isHorror = true;
      horrorOverlay.classList.add('active');
      catContainer.classList.add('glitch');
      setTimeout(() => {
        blackScreen.style.display = 'block';
        blackScreen.style.opacity = '1';
        setTimeout(() => {
          catContainer.style.display = 'none';
          gameTitle.style.display = 'none';
          fairyBg.style.opacity = '0';
          horrorOverlay.style.background = 'rgba(0,0,0,1)';
          blackScreen.style.opacity = '0';
          setTimeout(() => {
            blackScreen.style.display = 'none';
          }, 50);
          scareCanvas.style.display = 'block';
          resizeScareCanvas();
          scareVideoSrc.currentTime = 0;
          scareVideoSrc.playbackRate = 2.0;
          const playPromise = scareVideoSrc.play();
          if (playPromise !== undefined) {
            playPromise.catch(() => {
              document.addEventListener('click', function onceClick() {
                scareVideoSrc.play();
                document.removeEventListener('click', onceClick);
              }, { once: true });
            });
          }
          body.classList.add('screen-shake');
          bloodFlash.classList.add('blood-flash-active');
          body.classList.add('hide-cursor');
          STATE.scareTimer = setTimeout(onScareEnd, 2500);
        }, 200);
      }, 800);
    }

    scareVideoSrc.addEventListener('ended', onScareEnd);

    function resetGame() {
      STATE.clickCount = 0;
      STATE.isHorror = false;
      STATE.isPaused = false;
      if (STATE.scareTimer) {
        clearTimeout(STATE.scareTimer);
        STATE.scareTimer = null;
      }
      scareVideoSrc.pause();
      scareVideoSrc.currentTime = 0;
      scareCanvas.style.display = 'none';
      resetBtn.classList.remove('show');
      horrorOverlay.classList.remove('active');
      horrorOverlay.style.background = 'rgba(0,0,0,0)';
      bloodFlash.classList.remove('blood-flash-active');
      body.classList.remove('screen-shake', 'hide-cursor');
      fairyBg.style.opacity = '1';
      fairyBg.classList.remove('bg-fade');
      gameTitle.style.display = 'block';
      gameTitle.style.opacity = '1';
      catContainer.style.display = 'block';
      catContainer.classList.remove('glitch');
      catVideoSrc.play();
      initCatPosition();
      hideBubble();
    }

    window.addEventListener('resize', () => {
      resizeScareCanvas();
      const maxX = window.innerWidth - STATE.catSize;
      const maxY = window.innerHeight - STATE.catSize;
      STATE.posX = Math.min(STATE.posX, maxX);
      STATE.posY = Math.min(STATE.posY, maxY);
      updateCatTransform();
    });

    function init() {
      resizeScareCanvas();
      initCatPosition();
      renderLoop();
      moveCat();
      addTouchClick(catContainer, handleCatClick);
      addTouchClick(resetBtn, resetGame);
      catVideoSrc.play().catch(() => {
        document.addEventListener('click', function firstClick() {
          catVideoSrc.play();
          document.removeEventListener('click', firstClick);
        }, { once: true });
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
